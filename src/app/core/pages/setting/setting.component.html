<div class="max-w-lg custom p-6 bg-white shadow-md rounded-md">
  <h2 class="text-2xl font-semibold text-center mb-6">Registrar Nuevo Usuario</h2>
  <form (ngSubmit)="onSubmit()" #userForm="ngForm">
    <!-- Nombre de Usuario -->
    <div class="mb-4">
      <label for="userName" class="block text-sm font-medium text-gray-700">Nombre de Usuario</label>
      <input 
        type="text" 
        id="userName" 
        name="userName" 
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="user.nombre_usuario" 
        required 
      />
    </div>

    <!-- Contraseña -->
    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="user.clave" 
        required 
        minlength="6"
        #password="ngModel"
      />
      <div *ngIf="password.invalid && password.touched" class="text-red-500 text-sm">
        La contraseña debe tener al menos 6 caracteres.
      </div>
    </div>

    <!-- Confirmar Contraseña -->
    <div class="mb-4">
      <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirmar Contraseña</label>
      <input 
        type="password" 
        id="confirmPassword" 
        name="confirmPassword" 
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="user.confirmPassword" 
        required
        [pattern]="user.clave" 
      />
      <div *ngIf="user.clave !== user.confirmPassword && user.confirmPassword && userForm.touched" class="text-red-500 text-sm">
        Las contraseñas no coinciden.
      </div>
    </div>

    <!-- Roles -->
    <div class="mb-4">
      <label for="role" class="block text-sm font-medium text-gray-700">Rol</label>
      <select 
        id="role" 
        name="role" 
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="user.roles" 
        required
      >
        <option value="1">Administrador</option>
        <option value="2">Operario</option>
      </select>
    </div>
  
    <!-- Permisos -->
    <div class="mb-4">
      <label for="permissions" class="block text-sm font-medium text-gray-700">Permisos</label>
      <select 
        id="permissions" 
        name="permissions" 
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="user.permisos" 
        multiple
        required
      >
        <option value="1">Permiso CRUD</option>
        <option value="2">Permiso Read</option>
        <option value="3">Permiso Write</option>
        <option value="4">Permiso Delete</option>
      </select>
    </div>

    <!-- Botón de Submit -->
    <div class="mb-4">
      <button 
        type="submit" 
        [disabled]="userForm.invalid" 
        class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 focus:outline-none"
      >
        Registrar Usuario
      </button>
    </div>

    <!-- Mensajes de Error o Éxito -->
    <div *ngIf="errorMessage" class="text-red-500 text-sm mt-4 text-center">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="text-green-500 text-sm mt-4 text-center">
      {{ successMessage }}
    </div>
  </form>
</div>
